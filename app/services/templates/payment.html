<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>플랜 결제하기</title>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🚀 {{ plan_name }} 플랜 결제</h2>
        <p>가격: <strong>{{ price }}원</strong><br>생성 횟수: {{ amount }}회 충전</p>
        <button class="btn" onclick="requestPay()">결제하기</button>
    </div>

    <script>
        // 1. 가맹점 식별코드 초기화 (아까 찾은 'imp...' 값 입력!)
        // ⚠️ 서버에서 넘겨받을 수도 있지만, 일단은 여기에 직접 적어주세요.
        var userCode = "imp43341573";
        IMP.init(userCode);

        function requestPay() {
            // 2. 결제 요청
            IMP.request_pay({
                pg: "html5_inicis",           // 콤마 확인!
                pay_method: "card",           // 콤마 확인!
                merchant_uid: "order_" + new Date().getTime(), // 콤마 확인!
                name: "{{ plan_name }} 플랜 충전", // 콤마 확인!
                amount: Number("{{ price }}"),        // 콤마 확인!
                buyer_email: "{{ email }}",   // 콤마 확인!
                buyer_name: "{{ email }}"     // 마지막 줄은 콤마가 없어도 되지만, 있어도 상관없습니다.
            }, function (rsp) { // 👈 [여기가 제일 중요!] 중괄호 닫고 '}' 뒤에 콤마 ','가 꼭 있어야 합니다!
                
                if (rsp.success) {
                    // 3. 결제 성공 시 로직
                    alert("결제가 완료되었습니다! 처리를 위해 잠시만 기다려주세요.");
                    
                    // 서버로 검증 요청
                    fetch("/api/payment/verify", {
                        method: "POST",   // 콤마 확인!
                        headers: { "Content-Type": "application/json" }, // 콤마 확인!
                        body: JSON.stringify({
                            imp_uid: rsp.imp_uid,      // 콤마 확인!
                            merchant_uid: rsp.merchant_uid, // 콤마 확인!
                            email: "{{ email }}",      // 콤마 확인!
                            plan_name: "{{ plan_name }}"
                        })
                    }).then(response => {
                        if (response.ok) {
                            alert("충전이 성공적으로 완료되었습니다! 프로그램을 확인해주세요.");
                            window.close();
                        } else {
                            alert("결제는 되었으나 충전 처리에 실패했습니다. 관리자에게 문의하세요.");
                        }
                    });
                } else {
                    // 결제 실패 시
                    alert("결제 실패: " + rsp.error_msg);
                }
            });
        }
        // 페이지 열리자마자 자동 결제창 띄우고 싶으면 아래 주석 해제
        // window.onload = function() { requestPay(); };
    </script>
</body>

</html>
